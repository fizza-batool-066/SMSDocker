version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: sms-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: SMS
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: ./backend
    container_name: sms-backend
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/SMS
      MONGODB_DATABASE: SMS
    command: npm start

  frontend:
    build:
      context: ./frontend
    container_name: sms-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mongo-data:
